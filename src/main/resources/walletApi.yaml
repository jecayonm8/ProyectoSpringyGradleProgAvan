openapi: 3.0.0
info:
  title: API de Banca Virtual
  version: 1.0.0

paths:
  /users:
    post:
      summary: Registrar un nuevo usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ID o email duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    put:
      summary: Actualizar datos del usuario
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar usuario
      operationId: deleteUser
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '202':
          description: Eliminación aceptada (procesándose)
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/password:
    patch:
      summary: Actualizar contraseña
      operationId: updatePassword
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdate'
      responses:
        '200':
          description: Contraseña actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos faltantes o inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '498':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/wallet:
    post:
      summary: Crear billetera virtual
      operationId: createWallet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreation'
      responses:
        '201':
          description: Billetera creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El usuario ya tiene una billetera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/login:
    post:
      summary: Iniciar sesión
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions:
    post:
      summary: Realizar transferencia entre billeteras
      description: Transfiere monto desde billetera de origen a billetera de destino. Valida saldo suficiente en la billetera de origen.
      operationId: createTransaction
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
            examples:
              ok:
                summary: Transferencia válida
                value:
                  billeteraOrigen: "1234567890"
                  billeteraDestino: "0987654321"
                  monto: 50000
                  categoria: "servicios"
      responses:
        '201':
          description: Transacción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Datos inválidos (monto <= 0 o billeteras mal formadas/iguales)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Billetera origen o destino no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Saldo insuficiente en billetera de origen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /wallets/{idWallet}/balance:
    get:
      summary: Consultar saldo de una billetera
      operationId: getWalletBalance
      security:
        - BearerAuth: [ ]
      parameters:
        - name: idWallet
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{10}$'
      responses:
        '200':
          description: Saldo actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Billetera no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /wallets/{idWallet}/topup:
    post:
      summary: Recargar billetera
      description: Incrementa el saldo. El valor debe ser positivo.
      operationId: topupWallet
      security:
        - BearerAuth: [ ]
      parameters:
        - name: idWallet
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{10}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
            examples:
              ok:
                value: { valor: 75000 }
      responses:
        '200':
          description: Saldo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '400':
          description: Valor inválido (<= 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Billetera no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /wallets/{idWallet}/transactions:
    get:
      summary: Consultar transacciones de una billetera
      description: Lista las transacciones de la billetera. Puede filtrar por categoría y/o por periodo [fechaInicio, fechaFin].
      operationId: listWalletTransactions
      security:
        - BearerAuth: [ ]
      parameters:
        - name: idWallet
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{10}$'
        - name: categoria
          in: query
          required: false
          schema: { type: string }
        - name: fechaInicio
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: ISO-8601, ej. 2025-08-29T00:00:00Z
        - name: fechaFin
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: ISO-8601, ej. 2025-08-30T23:59:59Z
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Lista de transacciones (paginada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Billetera no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  schemas:
    UserRegistration:
      type: object
      required: [id, nombre, email, direccion, fechaNacimiento, telefono, password]
      properties:
        id: { type: string, example: "1095268216" }
        nombre: { type: string, example: "Samuel" }
        email: { type: string, format: email, example: "samuel@gmail.com" }
        direccion: { type: string, example: "La Paz" }
        fechaNacimiento: { type: string, format: date, example: "2005-02-23" }
        telefono: { type: string, example: "3192325795" }
        password: { type: string, minLength: 8, example: "samuel123" }

    UserUpdate:
      type: object
      required: [nombre, email, direccion]
      properties:
        nombre: { type: string }
        email: { type: string }
        direccion: { type: string }

    PasswordUpdate:
      type: object
      required: [contraseñaVieja, contraseñaNueva]
      properties:
        contraseñaVieja: { type: string }
        contraseñaNueva: { type: string }

    WalletCreation:
      type: object
      required: [nombreBilletera, monto, descripcion]
      properties:
        nombreBilletera: { type: string, example: "Gastos" }
        monto: { type: number, example: 150000 }
        descripcion: { type: string, example: "Para gastos" }

    LoginRequest:
      type: object
      required: [id, contraseña]
      properties:
        id: { type: string, example: "1095268216" }
        contraseña: { type: string, example: "samuelocm123" }

    LoginResponse:
      type: object
      properties:
        token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI..." }

    UserResponse:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        email: { type: string }
        direccion: { type: string }
        fechaNacimiento: { type: string, format: date }
        telefono: { type: string }

    WalletResponse:
      type: object
      properties:
        idWallet: { type: string, example: "1234567890" }
        idUsuario: { type: string, example: "1095268216" }
        saldo: { type: number, example: 150000 }

    SuccessResponse:
      type: object
      properties:
        message: { type: string, example: "Operación realizada con éxito" }

    ErrorResponse:
      type: object
      properties:
        error: { type: string, example: "Bad Request" }
        message: { type: string, example: "Faltan campos requeridos" }

    # ---  Esquemas nuevos agrgados ---
    TransactionCreate:
      type: object
      required: [billeteraOrigen, billeteraDestino, monto, categoria]
      properties:
        billeteraOrigen: { type: string, pattern: '^\d{10}$', example: "1234567890" }
        billeteraDestino: { type: string, pattern: '^\d{10}$', example: "0987654321" }
        monto: { type: number, minimum: 0.01, example: 50000 }
        categoria: { type: string, example: "servicios" }

    Transaction:
      type: object
      properties:
        idTransaccion: { type: string, format: uuid, example: "8c2b8a2a-0d2c-4c3a-9e41-1de3b0a1a1f0" }
        billeteraOrigen: { type: string, example: "1234567890" }
        billeteraDestino: { type: string, example: "0987654321" }
        monto: { type: number, example: 50000 }
        categoria: { type: string, example: "servicios" }
        fechaHora: { type: string, format: date-time, example: "2025-08-29T15:30:10Z" }

    WalletBalance:
      type: object
      properties:
        idWallet: { type: string, example: "1234567890" }
        saldo: { type: number, example: 200000 }

    TopUpRequest:
      type: object
      required: [valor]
      properties:
        valor: { type: number, minimum: 0.01, example: 75000 }

    TransactionPage:
      type: object
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, example: 3 }
        totalPages: { type: integer, example: 1 }
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
